<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免費開源 AI 聊天機器人 (OpenRouter)</title>
    <!-- 引入 Tailwind CSS 讓介面好看又現代 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用來解析 Markdown 訊息 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- 頂部導覽列 / 設定區 -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-xl font-bold flex items-center gap-2">
            🤖 <span>免費 AI 聊天機器人</span>
        </h1>
        <div class="flex items-center gap-2">
            <input type="password" id="apiKey" placeholder="請輸入您的 OpenRouter API Key" 
                class="bg-gray-700 border border-gray-600 px-3 py-1.5 rounded text-sm w-64 focus:outline-none focus:border-blue-500">
            <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-sm font-medium transition">儲存 Key</button>
        </div>
    </header>

    <!-- 聊天訊息顯示區 -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0">AI</div>
            <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm leading-relaxed">
                你好！請先在右上角輸入你的 **OpenRouter API Key**（可在 OpenRouter 申請免費帳號取得），並選擇免費模型即可開始聊天！
            </div>
        </div>
    </main>

    <!-- 底部輸入區 -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4">
        <div class="max-w-4xl mx-auto flex gap-2">
            <select id="modelSelect" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="deepseek/deepseek-r1:free">DeepSeek R1 (免費)</option>
                <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (免費)</option>
            </select>
            <input type="text" id="userInput" placeholder="輸入想問的問題..." 
                class="flex-1 bg-gray-700 border border-gray-600 rounded px-4 py-2 text-sm focus:outline-none focus:border-blue-500"
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded text-sm font-medium transition">發送</button>
        </div>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 頁面載入時檢查是否有儲存的 API Key
        window.onload = () => {
            const savedKey = localStorage.getItem('openrouter_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('openrouter_api_key', key);
                alert('API Key 已儲存至本地瀏覽器！');
            } else {
                localStorage.removeItem('openrouter_api_key');
                alert('API Key 已清除。');
            }
        }

        let chatHistory = [];

        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const userInput = document.getElementById('userInput').value.trim();
            const model = document.getElementById('modelSelect').value;

            if (!apiKey) {
                alert('請先輸入並儲存您的 OpenRouter API Key！');
                return;
            }
            if (!userInput) return;

            const chatContainer = document.getElementById('chatContainer');

            // 1. 顯示用戶訊息
            chatContainer.innerHTML += `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-gray-700 p-3 rounded-lg max-w-[80%] text-sm leading-relaxed">${escapeHtml(userInput)}</div>
                    <div class="bg-gray-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0">你</div>
                </div>
            `;
            
            document.getElementById('userInput').value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 記錄對話歷史
            chatHistory.push({ role: "user", content: userInput });

            // 2. 顯示思考中 / 載入狀態
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0">AI</div>
                    <div class="bg-gray-800 p-3 rounded-lg text-sm text-gray-400">思考中...</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // 3. 呼叫 OpenRouter API (標準 Chat Completions 格式)
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "HTTP-Referer": window.location.href, 
                        "X-OpenRouter-Title": "Free AI Web Chat",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": model,
                        "messages": chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message || JSON.stringify(data.error));
                }

                const aiReply = data.choices[0].message.content;
                chatHistory.push({ role: "assistant", content: aiReply });

                // 4. 顯示 AI 回覆 (支援 Markdown)
                chatContainer.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0">AI</div>
                        <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm leading-relaxed prose prose-invert">${marked.parse(aiReply)}</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-red-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0">!</div>
                        <div class="bg-red-900/50 border border-red-700 p-3 rounded-lg max-w-[80%] text-sm text-red-200">
                            發生錯誤: ${error.message}
                        </div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
